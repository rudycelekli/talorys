name: Validate fixed offset-date candidate

on:
  push:
    branches: [qualify/offset-due-dates-20261017]

permissions:
  contents: read

concurrency:
  group: qualify-offset-dates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-required-gates:
    if: github.repository == 'rudycelekli/talorys'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      TALORYS_ENV: "development"
      TALORYS_MOCK_AI: "1"
      WRANGLER_SEND_METRICS: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceabeede283a1c3d1c719589228a6e952bc1002c
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source, tree and parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ceabeede283a1c3d1c719589228a6e952bc1002c
          test "$(git rev-parse 'HEAD^{tree}')" = 3e9b8769ce7eff888072343f2d6b8894bdddb5a4
          test "$(git rev-parse 'HEAD^')" = 2f8e33b8ccaaabcc79bf1dd457c5dbed4092674e
          git log -1 --format='%H %T %P'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
